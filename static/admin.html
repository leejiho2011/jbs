<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Music Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0a0a0b;
  --sidebar:#111113;
  --surface:#151518;
  --surface-2:#1b1b20;
  --border:#27272f;
  --border-soft:#1f1f25;
  --text:#fafafa;
  --muted:#8b8b95;
  --accent:#5e6ad2;
  --accent-soft:rgba(94,106,210,.14);
  --green:#30a46c;
  --red:#e5484d;
  --yellow:#f5a524;
  --radius:16px;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
}

button,input{
  font-family:inherit;
}


#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(circle at top, rgba(94,106,210,.16), transparent 40%),
    #09090b;
}

.login-box{
  width:100%;
  max-width:380px;
  background:rgba(20,20,24,.9);
  border:1px solid var(--border);
  border-radius:24px;
  padding:32px;
  backdrop-filter:blur(20px);
  box-shadow:0 0 0 1px rgba(255,255,255,.02) inset;
}

.login-box h2{
  font-size:1.5rem;
  margin-bottom:6px;
}

.login-box .sub{
  color:var(--muted);
  font-size:.92rem;
  margin-bottom:28px;
}

.login-field{
  margin-bottom:14px;
}

.login-field label{
  display:block;
  font-size:.82rem;
  color:var(--muted);
  margin-bottom:8px;
}

.login-field input{
  width:100%;
  height:48px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  padding:0 14px;
  outline:none;
  transition:.15s;
}

.login-field input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 4px rgba(94,106,210,.15);
}

.login-btn{
  width:100%;
  height:48px;
  border:none;
  border-radius:12px;
  background:var(--text);
  color:#111;
  font-weight:600;
  cursor:pointer;
  transition:.15s;
}

.login-btn:hover{
  opacity:.92;
}

.login-err{
  margin-top:12px;
  color:var(--red);
  font-size:.84rem;
}


#adminApp{display:none;height:100vh}
.layout{
  display:flex;
  height:100%;
}

.sidebar{
  width:250px;
  border-right:1px solid var(--border-soft);
  background:rgba(14,14,16,.95);
  padding:18px;
  display:flex;
  flex-direction:column;
}

.brand{
  height:48px;
  display:flex;
  align-items:center;
  padding:0 14px;
  border-radius:12px;
  background:var(--surface);
  font-weight:700;
  letter-spacing:-.02em;
  margin-bottom:20px;
}

.nav-item{
  height:42px;
  border:none;
  background:transparent;
  color:var(--muted);
  border-radius:10px;
  padding:0 14px;
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
  transition:.15s;
  font-size:.92rem;
}

.nav-item:hover{
  background:var(--surface);
  color:var(--text);
}

.nav-item.active{
  background:var(--accent-soft);
  color:#c7d2fe;
}

.nav-badge{
  margin-left:auto;
  min-width:18px;
  height:18px;
  border-radius:999px;
  background:var(--red);
  color:#fff;
  font-size:.72rem;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 6px;
}

.sidebar-footer{
  margin-top:auto;
}

.logout-btn{
  width:100%;
  height:42px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--surface);
  color:#ddd;
  cursor:pointer;
}

.content{
  flex:1;
  overflow:auto;
  padding:32px;
}

.page{display:none}
.page.active{display:block}

.page-title{
  font-size:1.8rem;
  font-weight:700;
  letter-spacing:-.03em;
  margin-bottom:24px;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
  margin-bottom:20px;
}

.stat-card,
.card,
.broadcast-status{
  background:var(--surface);
  border:1px solid var(--border-soft);
  border-radius:18px;
}

.stat-card{
  padding:20px;
}

.stat-card .val{
  font-size:2rem;
  font-weight:700;
  letter-spacing:-.05em;
}

.stat-card .lbl{
  margin-top:8px;
  color:var(--muted);
  font-size:.82rem;
}

.blue .val{color:#8ea2ff}
.green .val{color:#4ade80}
.yellow .val{color:#fbbf24}
.red .val{color:#fb7185}

.broadcast-status{
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.broadcast-info{
  display:flex;
  gap:14px;
  align-items:center;
}

.live-indicator{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#555;
}

.live-indicator.on{
  background:#4ade80;
  box-shadow:0 0 10px #4ade80;
}

.btn{
  height:40px;
  padding:0 16px;
  border-radius:10px;
  border:none;
  cursor:pointer;
  font-weight:600;
  transition:.15s;
}

.btn:hover,
.action-btn:hover{
  opacity:.9;
}

.btn-primary{
  background:var(--text);
  color:#111;
}

.btn-green{
  background:rgba(74,222,128,.12);
  color:#4ade80;
  border:1px solid rgba(74,222,128,.2);
}

.btn-red{
  background:rgba(251,113,133,.12);
  color:#fb7185;
  border:1px solid rgba(251,113,133,.2);
}

.card{
  padding:22px;
  margin-bottom:16px;
}

.card h3{
  margin-bottom:18px;
  font-size:1rem;
}

.filter-tabs{
  display:flex;
  gap:8px;
  margin-bottom:18px;
}

.tab{
  height:34px;
  padding:0 14px;
  border-radius:999px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--muted);
  cursor:pointer;
}

.tab.active{
  background:var(--text);
  color:#111;
  border-color:transparent;
}

.req-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.req-row{
  display:flex;
  align-items:center;
  gap:14px;
  padding:14px;
  border-radius:14px;
  background:var(--surface-2);
  border:1px solid transparent;
}

.req-row:hover{
  border-color:#32323c;
}

.req-thumb{
  width:76px;
  height:52px;
  object-fit:cover;
  border-radius:10px;
}

.req-meta{
  flex:1;
  min-width:0;
}

.req-title{
  font-size:.94rem;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.req-sub{
  margin-top:5px;
  font-size:.8rem;
  color:var(--muted);
}

.req-actions{
  display:flex;
  gap:8px;
}

.action-btn{
  height:34px;
  border:none;
  padding:0 12px;
  border-radius:10px;
  cursor:pointer;
  font-size:.82rem;
  font-weight:600;
}

.ab-approve{
  background:rgba(74,222,128,.14);
  color:#4ade80;
}

.ab-reject{
  background:rgba(251,113,133,.14);
  color:#fb7185;
}

.ab-delete{
  background:rgba(255,255,255,.06);
  color:#ddd;
}

.ab-block{
  background:rgba(229,72,77,.14);
  color:var(--red);
}

.badge{
  padding:5px 10px;
  border-radius:999px;
  font-size:.74rem;
  font-weight:700;
}

.b-pending{background:rgba(251,191,36,.12);color:#fbbf24}
.b-approved{background:rgba(74,222,128,.12);color:#4ade80}
.b-rejected{background:rgba(251,113,133,.12);color:#fb7185}

.schedule-form, .block-form{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
}

.form-group label{
  display:block;
  margin-bottom:8px;
  color:var(--muted);
  font-size:.82rem;
}

.form-group input{
  width:100%;
  height:44px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--surface-2);
  color:var(--text);
  padding:0 12px;
  outline:none;
}

.playlist-item, .blocked-item{
  display:flex;
  align-items:center;
  gap:14px;
  padding:12px 0;
  border-bottom:1px solid var(--border-soft);
}

.playlist-item:last-child, .blocked-item:last-child{
  border-bottom:none;
}

.pl-num, .bl-id{
  width:60px;
  color:var(--muted);
}

.pl-title, .bl-reason{
  flex:1;
}

.pl-time{
  color:#8ea2ff;
}

.empty{
  padding:40px 0;
  text-align:center;
  color:var(--muted);
}

.toast{
  position:fixed;
  right:24px;
  bottom:24px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px 18px;
  display:flex;
  align-items:center;
  gap:10px;
  transform:translateY(20px);
  opacity:0;
  transition:.2s;
  z-index: 1000;
}

.toast.show{
  opacity:1;
  transform:translateY(0);
}

@media(max-width:900px){
  .stats-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .schedule-form, .block-form{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:720px){
  .sidebar{
    display:none;
  }

  .content{
    padding:18px;
  }

  .stats-grid{
    grid-template-columns:1fr;
  }

  .broadcast-status{
    flex-direction:column;
    align-items:flex-start;
  }

  .req-row{
    flex-direction:column;
    align-items:flex-start;
  }

  .req-thumb{
    width:100%;
    height:180px;
  }
}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h2>관리자 로그인</h2>
    <p class="sub">방송 시스템 관리자 페이지</p>

    <div class="login-field">
      <label>아이디</label>
      <input type="text" id="loginUser" placeholder="admin">
    </div>

    <div class="login-field">
      <label>비밀번호</label>
      <input type="password" id="loginPass" placeholder="">
    </div>

    <button class="login-btn" id="loginBtn" onclick="doLogin()">로그인</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<div id="adminApp">
  <div class="layout">

    <aside class="sidebar">
      <div class="brand">Music Admin</div>

      <button class="nav-item active" onclick="showPage('dashboard')" id="nav-dashboard">
        대시보드
      </button>

      <button class="nav-item" onclick="showPage('requests')" id="nav-requests">
        음악 신청
        <span class="nav-badge" id="pendingBadge" style="display:none"></span>
      </button>

      <button class="nav-item" onclick="showPage('schedule')" id="nav-schedule">
        방송 스케줄
      </button>

      <button class="nav-item" onclick="showPage('broadcast')" id="nav-broadcast">
        방송 관리
      </button>

      <button class="nav-item" onclick="showPage('blocked')" id="nav-blocked">
        차단 관리
      </button>

      <button class="nav-item" onclick="showPage('logs')" id="nav-logs">
        방송 로그
      </button>

      <div class="sidebar-footer">
        <button class="logout-btn" onclick="doLogout()">로그아웃</button>
      </div>
    </aside>

    <main class="content">

      <div class="page active" id="page-dashboard">
        <div class="page-title">대시보드</div>

        <div class="stats-grid" id="statsGrid"></div>

        <div class="broadcast-status" id="broadcastStatusCard">
          <div class="broadcast-info">
            <div class="live-indicator" id="adminLiveDot"></div>
            <div>
              <div style="font-weight:600" id="adminLiveTitle">방송 상태 확인 중...</div>
              <div style="font-size:.82rem;color:var(--muted)" id="adminLiveSub"></div>
            </div>
          </div>

          <div style="display:flex;gap:10px">
            <button class="btn btn-green" id="startBroadcastBtn" onclick="startBroadcast()">방송 시작</button>
            <button class="btn btn-red" id="stopBroadcastBtn" onclick="stopBroadcast()">방송 종료</button>
          </div>
        </div>

        <div class="card">
          <h3>오늘 플레이리스트</h3>
          <div id="dashPlaylist"></div>
        </div>
      </div>

      <div class="page" id="page-requests">
        <div class="page-title">음악 신청 관리</div>

        <div class="card">
          <div class="filter-tabs">
            <button class="tab active" onclick="filterRequests('all', this)">전체</button>
            <button class="tab" onclick="filterRequests('pending', this)">대기</button>
            <button class="tab" onclick="filterRequests('approved', this)">승인</button>
            <button class="tab" onclick="filterRequests('rejected', this)">거절</button>
          </div>

          <div class="req-list" id="reqList"></div>
        </div>
      </div>

      <div class="page" id="page-schedule">
        <div class="page-title">방송 스케줄</div>

        <div class="card">
          <h3>새 스케줄</h3>

          <div class="schedule-form">
            <div class="form-group">
              <label>날짜</label>
              <input type="date" id="schedDate">
            </div>

            <div class="form-group">
              <label>시작 시간</label>
              <input type="time" id="schedStart">
            </div>

            <div class="form-group">
              <label>종료 시간</label>
              <input type="time" id="schedEnd">
            </div>

            <div class="form-group">
              <label>&nbsp;</label>
              <button class="btn btn-primary" onclick="saveSchedule()">저장</button>
            </div>
          </div>
        </div>

        <div class="card">
          <h3>스케줄 목록</h3>
          <div id="scheduleList"></div>
        </div>
      </div>

      <div class="page" id="page-broadcast">
        <div class="page-title">방송 관리</div>

        <div class="card" id="broadcastDetailCard"></div>
      </div>

      <div class="page" id="page-blocked">
        <div class="page-title">차단 관리</div>

        <div class="card">
          <h3>학번 차단</h3>
          <div class="block-form">
            <div class="form-group">
              <label>차단할 학번</label>
              <input type="text" id="blockSid" maxlength="5" placeholder="10101">
            </div>
            <div class="form-group" style="grid-column: span 2;">
              <label>사유 (선택)</label>
              <input type="text" id="blockReason" placeholder="욕설 신청 등">
            </div>
            <div class="form-group">
              <label>&nbsp;</label>
              <button class="btn btn-red" onclick="saveBlock()">차단하기</button>
            </div>
          </div>
        </div>

        <div class="card">
          <h3>차단된 학번 목록</h3>
          <div id="blockedList"></div>
        </div>
      </div>

      <div class="page" id="page-logs">
        <div class="page-title">방송 로그</div>

        <div class="card">
          <div id="logList"></div>
        </div>
      </div>

    </main>
  </div>
</div>

<div class="toast" id="adminToast">
  <span id="adminToastIcon"></span>
  <span id="adminToastMsg"></span>
</div>

<script>




const API = '';
let jwtToken = sessionStorage.getItem('admin_jwt') || '';
let allRequests = [];
let currentFilter = 'all';

function isTokenExpired(token) {
  try {
    const payload = JSON.parse(atob(token.split('.')[1]));
    return payload.exp * 1000 < Date.now();
  } catch { return true; }
}

function authHeader() {
  return { 'Authorization': `Bearer ${jwtToken}`, 'Content-Type': 'application/json' };
}

async function authFetch(url, options = {}) {
  if (!jwtToken || isTokenExpired(jwtToken)) {
    showLogin();
    throw new Error('토큰 만료');
  }
  const res = await fetch(API + url, {
    ...options,
    headers: { ...authHeader(), ...(options.headers || {}) }
  });
  if (res.status === 401) { showLogin(); throw new Error('인증 실패'); }
  return res;
}



async function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginErr');

  if (!u || !p) { err.textContent = '아이디와 비밀번호를 입력하세요'; return; }

  btn.disabled = true;
  btn.innerHTML = '로그인 중...';
  err.textContent = '';

  try {
    const res = await fetch(`${API}/api/admin/login`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({username:u, password:p})
    });
    const data = await res.json();

    if (!res.ok) throw new Error(data.detail || '로그인 실패');

    jwtToken = data.access_token;
    sessionStorage.setItem('admin_jwt', jwtToken);
    showAdmin();

  } catch(e) {
    err.textContent = e.message;
  } finally {
    btn.disabled = false;
    btn.innerHTML = '로그인';
  }
}

function doLogout() {
  jwtToken = '';
  sessionStorage.removeItem('admin_jwt');
  showLogin();
}

function showLogin() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('adminApp').style.display = 'none';
}

function showAdmin() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('adminApp').style.display = 'block';
  loadDashboard();
  loadRequests();
  loadSchedules();
  loadLogs();
  loadBlocked();
  document.getElementById('schedDate').value = new Date().toISOString().split('T')[0];
  setInterval(loadDashboard, 10000);
  setInterval(loadRequests, 15000);
}



function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.getElementById('nav-'+name).classList.add('active');
  if (name === 'broadcast') loadBroadcastDetail();
  if (name === 'blocked') loadBlocked();
}



async function loadDashboard() {
  try {
    const [reqRes, statusRes] = await Promise.all([
      authFetch('/api/admin/requests'),
      authFetch('/api/admin/broadcast/status')
    ]);
    const reqData    = await reqRes.json();
    const statusData = await statusRes.json();

    renderStats(reqData.requests);
    renderBroadcastStatus(statusData);
    renderPlaylistPreview(statusData.playlist_preview || []);

  } catch(e) { console.error('[Dashboard]', e); }
}

function renderStats(requests) {
  const pending  = requests.filter(r => r.status==='pending').length;
  const approved = requests.filter(r => r.status==='approved').length;
  const rejected = requests.filter(r => r.status==='rejected').length;
  const total    = requests.length;

  const badge = document.getElementById('pendingBadge');
  if (pending > 0) { badge.style.display=''; badge.textContent=pending; }
  else badge.style.display='none';

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card blue"><div class="val">${total}</div><div class="lbl">총 신청</div></div>
    <div class="stat-card yellow"><div class="val">${pending}</div><div class="lbl">대기 중</div></div>
    <div class="stat-card green"><div class="val">${approved}</div><div class="lbl">승인됨</div></div>
    <div class="stat-card red"><div class="val">${rejected}</div><div class="lbl">거절됨</div></div>
  `;
}

function renderBroadcastStatus(data) {
  const dot   = document.getElementById('adminLiveDot');
  const title = document.getElementById('adminLiveTitle');
  const sub   = document.getElementById('adminLiveSub');
  const startBtn = document.getElementById('startBroadcastBtn');
  const stopBtn  = document.getElementById('stopBroadcastBtn');

  if (data.is_running) {
    dot.className = 'live-indicator on';
    title.textContent = ' 방송 중';
    sub.textContent = data.current_song ? ` ${data.current_song.title}` : '방송 진행 중';
    startBtn.disabled = true;
    stopBtn.disabled  = false;
  } else if (data.today_schedule) {
    dot.className = 'live-indicator';
    title.textContent = '방송 대기 중';
    sub.textContent = `${data.today_schedule.start_time} ~ ${data.today_schedule.end_time}`;
    startBtn.disabled = false;
    stopBtn.disabled  = true;
  } else {
    dot.className = 'live-indicator';
    title.textContent = '방송 없음';
    sub.textContent = '오늘 스케줄이 없습니다';
    startBtn.disabled = true;
    stopBtn.disabled  = true;
  }
}

function renderPlaylistPreview(playlist) {
  const el = document.getElementById('dashPlaylist');
  if (!playlist.length) {
    el.innerHTML = '<div class="empty">승인된 곡이 없거나 스케줄이 없습니다</div>';
    return;
  }
  el.innerHTML = playlist.map(s => `
    <div class="playlist-item">
      <span class="pl-num">${s.order}</span>
      <span class="pl-title">${esc(s.title)}</span>
      <span class="pl-time">${s.play_at || ''}</span>
      <span class="pl-dur">${s.duration_str || ''}</span>
    </div>
  `).join('');
}



async function loadRequests() {
  try {
    const res = await authFetch('/api/admin/requests');
    const data = await res.json();
    allRequests = data.requests;
    renderRequests();
  } catch(e) { console.error('[Requests]', e); }
}

function filterRequests(status, btn) {
  currentFilter = status;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderRequests();
}

function renderRequests() {
  const filtered = currentFilter === 'all'
    ? allRequests
    : allRequests.filter(r => r.status === currentFilter);

  const el = document.getElementById('reqList');
  if (!filtered.length) { el.innerHTML = '<div class="empty">신청 내역이 없습니다</div>'; return; }

  el.innerHTML = filtered.map(r => {
    const match = r.youtube_url.match(/(?:youtu\.be\/|v=)([\w\-]{11})/);
    const thumb = match ? `https://img.youtube.com/vi/${match[1]}/mqdefault.jpg` : '';
    const dur = r.duration ? `${Math.floor(r.duration/60)}:${String(r.duration%60).padStart(2,'0')}` : '-';
    const badge = {'pending':'<span class="badge b-pending">대기</span>','approved':'<span class="badge b-approved">승인</span>','rejected':'<span class="badge b-rejected">거절</span>'}[r.status] || '';
    
    let actions = '';
    if (r.status === 'pending') {
      actions = `
        <button class="action-btn ab-approve" onclick="approveReq(${r.id})"> 승인</button>
        <button class="action-btn ab-reject"  onclick="rejectReq(${r.id})"> 거절</button>
      `;
    }
    actions += `<button class="action-btn ab-block" onclick="blockReq('${r.student_id}')"> 차단</button>`;
    if (r.status !== 'pending') {
      actions += `<button class="action-btn ab-delete" onclick="deleteReq(${r.id})"></button>`;
    }

    return `
      <div class="req-row" id="req-${r.id}">
        ${thumb ? `<img class="req-thumb" src="${thumb}" onerror="this.style.display='none'">` : ''}
        <div class="req-meta">
          <div class="req-title">${esc(r.title)}</div>
          <div class="req-sub">학번: ${r.student_id}  ${dur}  ${r.created_at?.slice(5,16)}</div>
        </div>
        ${badge}
        <div class="req-actions">${actions}</div>
      </div>`;
  }).join('');
}

async function approveReq(id) {
  await authFetch(`/api/admin/approve/${id}`, {method:'PUT'});
  toast('', '승인했습니다', 'success');
  loadRequests();
  loadDashboard();
}
async function rejectReq(id) {
  await authFetch(`/api/admin/reject/${id}`, {method:'PUT'});
  toast('', '거절했습니다', 'error');
  loadRequests();
}
async function deleteReq(id) {
  if (!confirm('삭제하시겠습니까?')) return;
  await authFetch(`/api/admin/delete/${id}`, {method:'DELETE'});
  toast('', '삭제했습니다');
  loadRequests();
}
function blockReq(sid) {
  showPage('blocked');
  document.getElementById('blockSid').value = sid;
}



async function loadSchedules() {
  try {
    const res = await authFetch('/api/admin/schedules');
    const data = await res.json();
    renderSchedules(data.schedules);
  } catch(e) {}
}

function renderSchedules(schedules) {
  const el = document.getElementById('scheduleList');
  if (!schedules.length) { el.innerHTML = '<div class="empty">등록된 스케줄이 없습니다</div>'; return; }
  el.innerHTML = `
    <table style="width:100%;border-collapse:collapse">
      <thead>
        <tr style="border-bottom:1px solid var(--border);color:var(--muted);font-size:.78rem">
          <th style="padding:8px;text-align:left">날짜</th>
          <th style="padding:8px;text-align:left">시작</th>
          <th style="padding:8px;text-align:left">종료</th>
          <th style="padding:8px;text-align:left">길이</th>
        </tr>
      </thead>
      <tbody>
        ${schedules.map(s => {
          const start = s.start_time, end = s.end_time;
          const diff = calcDiff(start, end);
          const isToday = s.date === new Date().toISOString().split('T')[0];
          return `
            <tr style="border-bottom:1px solid var(--border);${isToday?'color:var(--accent)':''}">
              <td style="padding:9px">${s.date} ${isToday?'<span style="font-size:.7rem;background:var(--accent);color:#fff;padding:1px 6px;border-radius:10px">오늘</span>':''}</td>
              <td style="padding:9px;font-family:Space Mono,monospace">${start}</td>
              <td style="padding:9px;font-family:Space Mono,monospace">${end}</td>
              <td style="padding:9px;color:var(--muted)">${diff}</td>
            </tr>`;
        }).join('')}
      </tbody>
    </table>`;
}

function calcDiff(start, end) {
  try {
    const [sh,sm] = start.split(':').map(Number);
    const [eh,em] = end.split(':').map(Number);
    const diff = (eh*60+em) - (sh*60+sm);
    if (diff < 0) return '-';
    return `${Math.floor(diff/60)}시간 ${diff%60}분`;
  } catch { return '-'; }
}

async function saveSchedule() {
  const date  = document.getElementById('schedDate').value;
  const start = document.getElementById('schedStart').value;
  const end   = document.getElementById('schedEnd').value;
  if (!date || !start || !end) { toast('', '날짜와 시간을 모두 입력하세요', 'error'); return; }
  if (start >= end) { toast('', '종료 시간이 시작 시간보다 늦어야 합니다', 'error'); return; }

  try {
    const res = await authFetch('/api/admin/schedule', {
      method: 'POST',
      body: JSON.stringify({date, start_time:start, end_time:end})
    });
    if (res.ok) { toast('', '스케줄 저장 완료!', 'success'); loadSchedules(); loadDashboard(); }
  } catch(e) { toast('', '저장 실패', 'error'); }
}



async function loadBlocked() {
  try {
    const res = await authFetch('/api/admin/blocked');
    const data = await res.json();
    renderBlocked(data.blocked);
  } catch(e) {}
}

function renderBlocked(list) {
  const el = document.getElementById('blockedList');
  if (!list.length) { el.innerHTML = '<div class="empty">차단된 학번이 없습니다</div>'; return; }
  el.innerHTML = list.map(b => `
    <div class="blocked-item">
      <span class="bl-id">${b.student_id}</span>
      <span class="bl-reason">${esc(b.reason || '사유 없음')}</span>
      <span style="font-size:0.75rem; color:var(--muted); margin-right:12px;">${b.created_at.slice(0,10)}</span>
      <button class="action-btn ab-delete" onclick="unblockStudent('${b.student_id}')">해제</button>
    </div>
  `).join('');
}

async function saveBlock() {
  const sid = document.getElementById('blockSid').value.trim();
  const reason = document.getElementById('blockReason').value.trim();
  if (!/^\d{5}$/.test(sid)) { toast('', '학번 5자리를 입력하세요', 'error'); return; }

  try {
    const res = await authFetch('/api/admin/block', {
      method: 'POST',
      body: JSON.stringify({student_id: sid, reason})
    });
    if (res.ok) {
      toast('', '차단 완료', 'success');
      document.getElementById('blockSid').value = '';
      document.getElementById('blockReason').value = '';
      loadBlocked();
    }
  } catch(e) { toast('', '차단 실패', 'error'); }
}

async function unblockStudent(sid) {
  if (!confirm(`${sid} 학번 차단을 해제하시겠습니까?`)) return;
  try {
    const res = await authFetch(`/api/admin/unblock/${sid}`, {method:'DELETE'});
    if (res.ok) { toast('', '차단 해제됨'); loadBlocked(); }
  } catch(e) { toast('', '해제 실패', 'error'); }
}



async function loadBroadcastDetail() {
  try {
    const res = await authFetch('/api/admin/broadcast/status');
    const d = await res.json();
    const el = document.getElementById('broadcastDetailCard');
    el.innerHTML = `
      <h3>현재 방송 상태</h3>
      <div style="margin:12px 0;padding:14px;background:var(--surface);border-radius:8px">
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
          <div class="live-indicator ${d.is_running?'on':''}"></div>
          <span style="font-weight:600">${d.is_running ? '방송 중' : '방송 없음'}</span>
        </div>
        ${d.current_song ? `<div style="font-size:.85rem;color:var(--muted)">현재 곡: ${esc(d.current_song.title)}</div>` : ''}
        ${d.today_schedule ? `<div style="font-size:.85rem;color:var(--muted);margin-top:4px">오늘 스케줄: ${d.today_schedule.start_time} ~ ${d.today_schedule.end_time}</div>` : ''}
      </div>
      <div style="margin-top:8px;font-size:.82rem;color:var(--muted)">
        승인된 곡: ${d.approved_count}곡 /
        플레이리스트: ${(d.playlist_preview||[]).length}곡 선정
      </div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="btn btn-green" onclick="startBroadcast()" ${d.is_running?'disabled':''}> 수동 방송 시작</button>
        <button class="btn btn-red"   onclick="stopBroadcast()"  ${!d.is_running?'disabled':''}> 방송 중지</button>
      </div>
    `;
  } catch(e) {}
}

async function startBroadcast() {
  try {
    const res = await authFetch('/api/admin/broadcast/start', {method:'POST'});
    const d = await res.json();
    if (res.ok) { toast('', `방송 시작! ${d.playlist?.length||0}곡`, 'success'); loadDashboard(); loadBroadcastDetail(); }
    else toast('', d.detail || '시작 실패', 'error');
  } catch(e) { toast('', e.message, 'error'); }
}

async function stopBroadcast() {
  if (!confirm('방송을 중지하시겠습니까?')) return;
  try {
    const res = await authFetch('/api/admin/broadcast/stop', {method:'POST'});
    if (res.ok) { toast('', '방송이 중지됐습니다'); loadDashboard(); loadBroadcastDetail(); }
  } catch(e) { toast('', e.message, 'error'); }
}



async function loadLogs() {
  try {
    const res = await authFetch('/api/admin/logs');
    const data = await res.json();
    const el = document.getElementById('logList');
    if (!data.logs.length) { el.innerHTML = '<div class="empty">방송 로그가 없습니다</div>'; return; }
    el.innerHTML = data.logs.map(l => {
      const statusColor = {running:'var(--yellow)',finished:'var(--green)',error:'var(--red)'}[l.status] || 'var(--muted)';
      let playlist = [];
      try { playlist = JSON.parse(l.playlist); } catch {}
      return `
        <div style="border-bottom:1px solid var(--border);padding:12px 0">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
            <span style="font-weight:600">${l.date}</span>
            <span style="color:${statusColor};font-size:.8rem;text-transform:uppercase;font-weight:700">${l.status}</span>
          </div>
          <div style="font-size:.82rem;color:var(--muted)">
            ${l.start_time} ~ ${l.end_time || '-'}  ${playlist.length}곡
          </div>
        </div>`;
    }).join('');
  } catch(e) {}
}



function esc(s='') {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let toastTm;
function toast(icon, msg, type='') {
  const el = document.getElementById('adminToast');
  document.getElementById('adminToastIcon').textContent = icon;
  document.getElementById('adminToastMsg').textContent = msg;
  el.className = `toast ${type} show`;
  clearTimeout(toastTm);
  toastTm = setTimeout(() => el.classList.remove('show'), 3000);
}


if (jwtToken && !isTokenExpired(jwtToken)) {
  showAdmin();
} else {
  jwtToken = '';
  sessionStorage.removeItem('admin_jwt');
  showLogin();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('loginScreen').style.display !== 'none') doLogin();
});
